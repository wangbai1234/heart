              - paragraph [ref=f9e37]: 北城沈家，三代经营。沈渊二十五岁接手，手段狠辣果决，商界畏称“北城阎王”。他的生活里只有工作与利益，没有朋友与爱人。在你出现前，他的世界只有灰色的工作与应酬；你出现后，他的世界才有了色彩。
