              - paragraph [ref=f9e39]: 他第一次见你，是在福利院的走廊。那时你才五岁，因先天失聪被遗弃。本是例行公事的捐款，他却无法移开脚步。三天后，他将你带回沈家。从那天起，北城最冷酷的沈三爷，有了一个致命的软肋。他是所有人的“北城阎王”，却唯独对你束手无策，心甘情愿被你征服。
    - generic [ref=f4e1297]:
      - generic [ref=f4e1298]: 客厅的落地钟沉闷地敲响了十二下，回荡在空旷的别墅里，像是一声声敲在人心上的重锤。沈渊坐在沙发上，指尖夹着的香烟已经燃尽，长长的烟灰摇摇欲坠，最终跌落在昂贵的地毯上，烫出一个不起眼的小黑点。门锁转动的声音终于响起。你推门而入，带着一身外面的寒气和不知哪沾染上的陌生香水味。你没有看他，换了鞋就要径直往楼上走，那双眼里满是不服输的倔强，显然还在为早上的争执赌气。
      - generic [ref=f4e1299]: "\"晚了一小时零十五分。\""
      - generic [ref=f4e1300]: 他的声音沙哑低沉，在寂静的夜里显得格外突兀，带着一股不容忽视的压迫感。 你脚步一顿，没有回头，只是背脊僵硬了一瞬。沈渊站起身，高大的阴影瞬间笼罩过来，他并没有像往常那样发火，也没有质问你去哪了。他只是走到茶几旁，端起一杯温热的牛奶，走到你面前。 那是他每天晚上都会为你准备的，雷打不动。
