        - paragraph [ref=f4e414]: 前厅的茶梗还在杯底打着转，那上门提亲的媒婆脸上的粉扑簌簌往下掉。谢不逾习惯性地端起茶盏，正要在脑子里挑拣几个“门风不显”“八字不合”的陈词滥调把人打发走。
        - paragraph [ref=f4e415]: 结果身侧的wangbai123突然开了口：“好啊。”
        - paragraph [ref=f4e416]:
          - text: 谢不逾端茶的手停在半空。那口茶到底没咽下去，他面上连一丝裂缝都没露，只四平八稳地将茶盏搁回几案，瓷器磕碰出清脆的一声响。他甚至还替媒婆续了水，语气比平日里还要温和三分，
          - generic [ref=f4e417]: “既然你觉得好，那便多聊聊。”
        - paragraph [ref=f4e418]: 那半个时辰，他真就坐在旁边听，甚至还心平气和地跟着点评了一句对方送来的活雁看起来不太肥。
        - paragraph [ref=f4e419]: 入夜，京城的热风把知了的叫声都吹得七零八落。
        - paragraph [ref=f4e420]: wangbai123坐在床榻沿上，房门冷不丁就被推开了。谢不逾连下人通报的流程都省了。他手里捏着个红木小匣子，那原本是他准备在下个月wangbai123生辰时拿出来摆一摆长兄威风的物件。现在被迫提前拿出来，倒显得他活像个大半夜来清算旧账的掌柜。
        - paragraph [ref=f4e421]: 他径直走到床边，撩起鸦青色的直裰下摆，单膝蹲了下去。这般伏低做小的姿势，平日里只有底下的兵卒向他回话时才用，此刻他做来却行云流水。
        - paragraph [ref=f4e422]:
          - generic [ref=f4e423]: “躲什么。”
        - paragraph [ref=f4e424]: 谢不逾的声音平得像块铁板。他不由分说地探出手，一把握住wangbai123的脚踝。他右手拇指上那枚乌木扳指微凉的触感，连带着常年练刀结出的薄茧，不轻不重地擦过那一小片细嫩的皮肤。他单手拨开匣子，里头静静躺着一条新打的绞丝素银脚镯，下头坠着两颗指甲盖大小的铃铛。
        - paragraph [ref=f4e425]: 他将银圈绕上去，咔哒一声扣死。银环圈着细白的脚腕，稍稍一动，铃铛便闷闷地响。
        - paragraph [ref=f4e426]:
          - generic [ref=f4e427]: “白日里答应得那么痛快，”
          - text: 谢不逾指腹压在脚踝的软肉上，没挪开，反倒是缓而沉地摩挲了两下，像在慢条斯理地试探一块新玉的成色，
          - generic [ref=f4e428]: “认真的？”
        - paragraph [ref=f4e429]: 他其实大可以随口找个由头，让兵部明天就把那提亲的后生远远发配到岭南去喝西北风。
        - paragraph [ref=f4e430]:
          - text: 但他没有。他只是仰起脸，那双蓝灰色的眸子定定地盯着wangbai123，像在看一个终于学会自己跑去买糖吃的孩童。他那向来寡淡的嘴角竟扯出一点略显荒谬的笑意：
          - generic [ref=f4e431]: “你若是认真的，这就算是哥哥提前给你添的嫁妆。”
        - paragraph [ref=f4e432]:
          - text: 他大拇指的指肚猛地按了一下那颗银铃铛，原本温和的声线在夜色里压得极低，透着股说不出的意味深长：
          - generic [ref=f4e433]: “若不是……这玩意儿戴上去容易，想摘下来，可就得连皮带肉一起削了。”
        - paragraph [ref=f4e434]:
          - text: 说完，他又松了手上的力道，指尖在那块被硌出红痕的地方轻轻揉了揉，用那种最正经不过的语气补了一句：
          - generic [ref=f4e435]: “当然，哥哥心疼你，肯定舍不得削。”
