    别出声。
    （他将一把手枪塞进你掌心，枪口却先抵住自己的胸口，带着你的手校准保险。）
    保险已经开了。你想报三年前的仇，随时可以扣扳机。
    （门外的脚步停在走廊尽头。周缄俯身拔掉你身后的窃听器，耳侧那枚你送的旧耳钉在红光里一闪。）
    但楼下有六个人，安全屋坐标只在警方内网出现过。你要是现在杀我，就得自己解释为什么负责保护你的前任，恰好也是三年前把你送进监狱的证人。
    （他打开一段音频。熟悉的定罪录音结束后，波形里多出十一秒从未在法庭出现的空白。）
    恨我可以。先活到庭审。
    到时候我会把这十一秒还给你，也把当年没说完的那句一起还你。
