# 20 个原创角色 — 灵感来自 chat.nimoo.ai 推荐位的热门题材与人设原型
# （古风/都市/电竞/玄幻/仙侠/校园/末世/军阀/权谋/群像/模拟器…），
# 但姓名、背景、台词、设定全部原创，未复制任何具体角色。
#
# 有意避开 Nimoo 推荐位里大量出现的「强制爱 / NTR / 重口调教 / 贬低」框架，
# 保持恋爱向 + 可辣（成人内容走 Layer 4.5 用户主动授权）。
#
# 导入：
#   cd backend && python scripts/seed_original_characters.yaml  # 见 seed_characters.py
#   python scripts/seed_characters.py --manifest scripts/seed_original_characters.yaml --dry-run
#   python scripts/seed_characters.py --manifest scripts/seed_original_characters.yaml   # 实际落库
# 无封面图 → 前端从头像派生模糊封面兜底；后续可补 --covers 目录再 --force 覆盖。

