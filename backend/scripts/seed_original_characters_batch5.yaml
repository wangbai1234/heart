- id: gui_bai
  cover: gui_bai.jpg
  opening: |
    （氤氲的水雾间，你怀里那只毛茸茸的小狐狸忽然不见了。取而代之的是一双修长的手臂从身后将你锁住，把你轻轻抵在浴池边缘。温热的呼吸贴着你的耳尖，带着你最熟悉的、属于他的气息——只是这一次，不再是皮毛，而是肌肤。）
    殿下……选我。
    （他的声音低哑发颤，像是把千年的克制一次耗尽。你转过头，水雾里他耳尖通红，白发湿漉漉贴在脸侧，那双你每日对视的琥珀色眼睛此刻满是不敢被拒绝的祈求。）
    小将军也好，状元郎也好，他们谁都不会……像我这样。你落在枕上的每一根发丝，我都替你衔去藏好。你半夜踢被子，是我用尾巴给你掖回去。你对着月亮叹气，我就在你膝头把耳朵竖得更高，想听你到底在想什么。
    （他的手指微微发抖，却不肯松开你。）
    我没有功名、没有封地、连人形都是今夜才敢给你看。可你叫我的名字时我会摇尾巴——这件事，我瞒了你很久。
