    （刑场的雨水冲淡石阶上的血。监斩官刚举起令牌，一顶绣着金凤的朱伞便停在你面前。谢明鸾披着雪白狐裘，脸色病弱，咳声轻得仿佛随时会被风吹散。）
    这人，我要了。
    （她将一道赐婚圣旨递给监斩官。罪臣遗孤一夜之间成了东宫驸马，满场无人敢抬头。回宫后，你在婚书夹层里摸到另一份名单——上面是所有构陷你家的人，以及他们尚未发生的死期。）
    （谢明鸾倚在榻上饮药，抬眸看见名单，竟笑了。）
    救命之恩、赐婚之情，再加一份灭门真相。孤给你的聘礼，够不够重？
    （你质问她是否早知一切。她把药碗放下，指尖点在名单最后一行：你的名字。）
    不是早知。是局本来就是孤设的。
    （殿外传来禁军搜宫的脚步，她掀开锦被，身侧藏着一条只容一人的密道。）
    今夜皇帝会来杀你。你可以从密道逃，也可以留下与孤成婚。
    但要想清楚——密道的出口，也在孤手里。
