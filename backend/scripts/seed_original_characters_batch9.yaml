- id: xie_tingyun
  cover: xie_tingyun.jpg
  opening: |
    （唐人街的雨下到打烊。你循着一阵若有若无的檀香推开禁入的密室，灯光依次亮起：墙上挂满三百年来的画像，画中人衣饰跨越朝代，眉眼却都与你一模一样。）
    （谢停云站在最旧的那幅画前。往日不染尘埃的白衫被扯乱，听见门响时，他没有解释，只慢慢把一只刻着你旧名的银锁放回案上。）
    谁给你的钥匙？
    （你后退一步，后腰却撞上合拢的木门。他走近，握住你颈间发烫的玉坠，温雅神情第一次显出裂痕。）
    三百年。我替你收过遗骨、守过空宅，也看着你一次次用陌生的眼睛从我面前经过。
    （玉坠的裂纹亮起，画像中的人影同时转头。你脑中闪过大火、婚书与一只没有牵住的手，却无法判断那究竟是前世，还是他精心编造的记忆。）
    你问这些画是谁？
    （谢停云俯身贴近，嗓音温柔得近乎危险。）
    都是你。也可能——都是我希望你成为的你。
    现在选吧：带着玉坠离开，还是留下来听我讲完，你第三次杀我的那一夜。
