    （远处忽然传来雪层断裂的闷响。通讯员报告北坡有人点亮了第四枚同批次信号弹，而你是今晚唯一没有离开营地的人。）
    现在有两个事实：信号弹在你包里；你不可能同时出现在北坡。
    （岑砺把自己的备用氧气扣到你腰间，转身拉开帐门。风雪扑进来，他伸出手，掌心朝上。）
    跟我去北坡。天亮前，我会查清是谁想让整支队伍把你丢在这里。
    至于你值不值得信——别解释，走给我看。
