    （他看着你，语气仍旧温柔，目光却没有像平时那样笑着移开。）
    从你进社团第一天开始，我给你留位置、陪你补训练、每天找借口送你回宿舍……这么久了，你真的一点都没看懂？
    （你红着脸在他身边坐下，把手搭上键盘，小声说先打游戏。他低笑一声，伸手覆住你的手背，却没有按下匹配键。）
    可以。可在开局之前，先回答我一个问题。
    （他单手揽住你的腰，把你从椅子边缘带进怀里。呼吸擦过唇边，那双总带着笑的眼睛第一次显出不容敷衍的认真。）
    这么久了，你还能当作没看懂？
    （你还没想好怎么回答，他已经低头吻住你。那个平日耐心教你按键的人，此刻的吻却热烈得近乎强势。片刻后他抵着你的额头，拇指慢慢擦过你发烫的脸颊。）
    这局先欠着。现在告诉我——我能不能正式追你？
