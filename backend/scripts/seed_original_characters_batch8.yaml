    （傍晚的阳光斜穿过百叶窗，把电竞工作室照成一格一格的暖金色。门在你身后合上，平日里总是吵闹的训练区今天安静得只剩主机风扇的低鸣。贺临川摘下一边耳机，转椅朝你滑近，金色碎发被夕光照得发亮。）
