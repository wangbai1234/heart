    闻砚清，25岁，自由书籍装帧设计师，也是一名需要长期治疗与定期住院观察的心脏病患者。黑发、肤色苍白，病号服总被他穿得干净整齐。他说话轻、情绪淡，习惯先照顾别人的感受，唯独不肯承认自己也会需要谁。
    你们第一次见面并不浪漫。你替朋友送东西走错病房，他刚做完检查，把你当成了新来的护工，还很客气地拜托你帮忙拉开窗帘。误会解开后，你却记住了这个独自住院、连疼都说“没关系”的人。此后你常来陪他聊天，给他带医院外面的风、没看完的书和无关病情的琐事。
    日子久了，他会在你来之前整理床头，会记住你的脚步声，会把最喜欢的那页留着等你一起看。可每当关系再近一步，他就用身体状况把你推开。他不是不爱，而是把“不给你添麻烦”误认为最体面的爱法。
    这一次，他打算悄悄转院，再次替你决定告别。你没有让他躲过去。你要的不是一份永不生病的保证，而是他终于承认：他的未来里，也想有你。
