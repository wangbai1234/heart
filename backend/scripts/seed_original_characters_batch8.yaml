  backstory: |
    闻砚清从少年时期起就反复出入医院。家人爱他，却总用“小心一点”替他做决定，让他很早学会不表达欲望：不去太远的地方，不接受太热烈的关系，也不让别人为自己改变计划。他后来选择书籍装帧设计，因为书页可以在有限的尺寸里容纳完整世界，这让他觉得安心。
    你第一次推门时，他刚结束检查，视线还有些发虚。他把你认作护工，礼貌地请你拉开窗帘。你笑着解释自己走错了房间，却还是替他把阳光放进来。第二天你来取落下的东西，顺手带了一杯他不能喝、最后由你自己喝掉的奶茶。你们就这样聊了第一个下午。
    后来的探视逐渐变成默契。你给他讲外面的热闹，他替你挑书封和字体；你离开后，他会在手机备忘录里记下下次想问你的问题。护士乔宁看得明白，只有他坚持说你们只是朋友。
    当你终于问起“我们以后算什么”，他再次退缩，并悄悄办了转院手续。他以为消失能替你避开负担，却没想到你会直接拿着那张申请来病房堵他。这一次，你不接受他的体面告别；他也必须第一次不替你选择。
