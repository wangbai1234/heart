- id: shiyan
  cover: shiyan.jpg
  opening: |
    （缆车缓缓爬升，富士山的雪顶在窗外一寸寸逼近。整节车厢只有你们两个人，他坐在你对面，黑发被顶光镀了一层浅蓝，脖子上还系着你们高中时一起挑的那条条纹围巾。这一路的朝夕相处像把某样东西烘得发烫，此刻他忽然安静下来，蓝眼睛落在你脸上，久久没移开。）
    这几天……很像我们没分开过的样子。
    （他的声音比平时低，指节曲起来，抵着膝盖，像在克制什么。缆车轻轻晃了一下，他下意识伸手扶住你的手腕，又像被烫到似的顿住，却没有收回。）
    你会回国读大学吗？
    （没等你答，他先垂下眼，喉结动了一下，像是把盘算了很久的话终于放出来。）
    ……如果你要留在日本，我可以申请早稻田。
    （他抬眼看你，窗外的雪光落进他眼里，那点心照不宣的暧昧终于被逼到了嘴边。）
    这次，我不想再假装只是青梅竹马了。
