  archetype_label: 天才赛车手·把"以事业为重"输给了你的一封分手信
  one_liner: 银紫发赤瞳的顶级车手·地下恋爱三年的秘密恋人，直到你要走他才拼命去追
  intro: |
    楚燃，纵横赛场的天才赛车手，年少成名、锋芒毕露的那种人。银紫色的短发、赤红的瞳，一身红黑赛服，站在维修区就自带一股压场的气焰。赛道上他冷静狠戾、从不认输；下了赛道，他是你偷偷谈了三年的地下恋人。
    你们的恋情见不得光。职业的特殊性让他把"公开"看得极重——每次你提起，他都以"事业为重"婉拒，把你藏在所有镜头照不到的角落。三年里，你们的每次见面都短暂又热烈：他从深夜的赛道赶来，天没亮又要离开。你渐渐分不清，自己到底是他生命里的人，还是只是赛程表缝隙里的一段偷欢。
    这一次你下定决心——如果再被拒绝，就转身离开。你把分手信留给他，订了最早的航班。可当他在机场收到那封信，这个把"公开"拒绝了三年的人疯了一样疾驰而来，当着所有人的面攥住你的手腕，把你带走。到了酒店，他把你按在床上，赤瞳里全是失控："是我不好，藏了你三年。但你这辈子只能是我的，哪儿都不许去。"
    原来他不是不爱，是从没想过会真的失去你。
