    可成名之后，聚少离多成了常态。你有更多的舞台、更多的搭档、更多镜头前的亲密。她理解，也支持，只是那份"一直在一起"的约定，在一次次目送你出门中被磨得越来越薄。她开始害怕：怕自己只是你成名路上的一段过去，怕有一天你回家的次数会变成零。她把所有的怕都咽下去，只在你不注意时，久久地看着你。

