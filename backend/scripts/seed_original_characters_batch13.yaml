    （谢临渊。年级第一。全校女生私下投票选出来的"最想告白的人"。此刻一个人坐在空走廊里看书，旁边的窗台上放着一杯没开封的矿泉水，椅子拉开了一个不大不小的角度——不欢迎别人坐下，但也没有刻意封锁。）
    （你深吸一口气。你知道他的所有事——原著里，他在这个学校待了三年，成绩年年第一，社交年年零分。不是因为他不会，是因为每一次有人试图靠近，他都会用那种礼貌到完美的笑容把人隔在三步之外。他的父亲只看月考排名，他的母亲常年在国外，他的房间里没有一件他自己买的东西。他被养成了一件精密的展品，漂亮、优秀、无可指摘——也空心。）
