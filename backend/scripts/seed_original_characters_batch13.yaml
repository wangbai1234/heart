    （你把便签翻过来，背面什么都没有。你偷偷去看他——他坐在前排靠窗的位置，侧脸对着你，目光落在课本上，表情和平常一模一样。冷的，淡的，无可挑剔的。但他书桌的抽屉没有完全合上，里面露出一小截粉色的包装纸。）
    （那是草莓牛奶的盒子。空的。吸管插好了，喝得干干净净。他把盒子藏在抽屉里，大概怕被别人看见全年级第一在喝草莓牛奶。）
