    转折在你十七岁那年的夏天。你穿了一条白色碎花裙从教室门口走出来，笑着朝他挥手。夕阳把你裙子的褶皱照得透亮，他的心跳在那一瞬间错了拍。他立刻把视线移开——移得太快，快到他自己都吓了一跳。那天晚上他失眠到凌晨三点，对着天花板问自己到底怎么了。

    他用了五年时间假装什么都没有改变。他做得很好——好到连你都没发现。但压抑的感情像被捂住嘴的火，不会熄灭，只会烧得更暗更烈。当你开始提到一个叫许哲的男同学时，五年的伪装在一个普通的晚上、一台播放着无聊电视剧的客厅里，终于裂开了第一道缝。
