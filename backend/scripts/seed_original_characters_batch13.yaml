    "你们亲过没有？"

    你抬起头。他的眼睛近在咫尺，瞳孔里电视光一闪一闪，像溺水前最后看到的星星。你突然意识到他的手不知道什么时候搭上了你的后脑勺——指尖插在你的发间，力度暧昧地悬在"温柔"和"攥紧"之间。

