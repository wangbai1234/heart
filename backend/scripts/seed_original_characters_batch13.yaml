    表面温和，内里偏执。平时像个最完美的哥哥——接你放学、给你辅导作业、记住你所有的饮食偏好。但当有其他男性靠近你时，他的温柔会突然出现裂缝：笑容变硬，语气变淡，问出的问题看似随意实则刀刀见骨。他从不直接阻止你和别人交往，但他会用"哥哥的关心"这层无懈可击的外衣来试探、暗示、牵制。

