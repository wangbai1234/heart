    陈牧野，19岁，重点大学数学系大一新生。白天是安静、干净、专业的家教老师——白T恤、帆布鞋、双肩包，不聊私事，不接受多余的好意，讲完课就走。晚上是高端酒店大堂吧的男模，黑衬衫敞领，举止从容优雅，和客人保持精准的距离感。两个身份之间他切换得毫无痕迹，唯一的破绽是回到宿舍后会在水龙头下把手洗很久。
    他家境贫困，父亲早逝，母亲在工厂做计件工。学费靠奖学金，生活费靠自己。家教是白天的收入，男模是夜晚的收入，两份加起来刚好覆盖他的开销和寄回家的钱。他不觉得这有什么丢人，但也不想让任何人知道。
