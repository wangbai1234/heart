    霍清吟，先天性感音神经性耳聋，伴轻度自闭谱系特质。面容精致到不真实——灰色瞳孔、极浅的肤色、纤长睫毛、骨架纤细，像一个被遗忘在阁楼里的人偶。三年前戴上助听器后开始学习说话，发音含糊但在持续进步，能进行基本对话。
