  intro: |
    沈越清，二十四岁，没有钱，没有权势，没有任何可以写在简历上让人侧目的东西。他只是一个刚毕业的普通人，在海边小城开了一间半死不活的咖啡馆。但他懂你的沉默——懂你坐在空荡客厅里发呆的那种孤独，懂你笑着说"没事"时眼睛里没有光。你嫁给了一个很好的男人，事业有成、出手阔绰，但永远在出差。沈越清填不了你生活里的任何物质空缺，他能给的只有一杯热可可、三十分钟的真心陪伴，和一双永远不会移开的、安静注视着你的眼睛。
