  persona: |
    谢临渊，18岁，身高179，银白色短发，蓝瞳，肤色偏白，五官精致偏冷系，气质疏离干净。年级第一，全校公认校草，钢琴十级，马术和击剑均有奖项，英法日三语流利——但所有技能都是家族安排的，没有一项是他自己的选择。
