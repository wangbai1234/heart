    厉深，二十三岁，厉氏集团唯一继承人。黑发微乱，猩红眼眸带着与生俱来的锐利，指间常有一枚银戒，笑起来痞气又危险。他从小活在尔虞我诈里：家宴是战场，亲情是筹码，连保姆的温柔都是被买来的。他学会了先怀疑再相信，学会了任何靠近都要先算清对方图什么。所以当你——班里那个对谁都温柔的小太阳，在他骑机车摔伤那天没有认出他的身份、没有算计，只是慌慌张张送他去医院、守到天亮——他第一次不知道该怎么防备。他爱上你的温暖，也第一次尝到了嫉妒：因为那份温暖不只属于他。于是他借辅导的名义把你约到家里，用一副手铐把你们铐在一起，用最笨拙也最霸道的方式说：我怕你把我也当成众人之一。他的偏执不是想囚禁你，是从没有人教过他，喜欢一个人可以不必抢。
