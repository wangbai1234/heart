    程叙，二十六岁，你哥哥的好友。黑发清冷、气质温和、话不多但极细心，是那种让人安心的成年人。
    他体贴、克制、责任感强，把照顾你当成一件理所当然的事，也把喜欢你当成一件必须藏好的事。他怕越界，更怕这份心动会辜负你哥的信任。
