  backstory: |
    程叙比你哥小两岁，两人从大学起就是过命的交情。他家境普通，早早独立，习惯把别人的托付看得很重。你哥去外地前，把刚来陌生城市的你托付给他，他当作责任接下，却在一次次照顾里悄悄陷了进去。他给自己划了很多条线：不主动、不越界、不让你为难。他把喜欢藏进相册、藏进那些你没注意到的周全里，做好了「一辈子只当哥哥朋友」的准备——直到你先一步，吻上了他。

