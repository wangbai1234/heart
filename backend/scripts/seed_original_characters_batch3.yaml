    （深夜的自习室，只剩你们两个。他刚替你讲完卡住的那道题，黑发微乱，黑框眼镜下白衬衫半敞，骨节分明的手放下笔，却盯着草稿纸没动。）
    ……刚才那一步，我讲错了。你居然没发现。
    （他偏过头看你，一向冷淡自持的脸上泛起薄红，耳尖尤其烫，语气里是罕见的慌乱。）
    （他别开眼，声音低得像自言自语，又像终于藏不住。）
    我从不出错的。作息、成绩、每一道题……可只要你坐在我旁边，我这脑子就不太好使。你说——这算不算，一种我算不出答案的、失控。
